services:
  bot-ofertas:
    build: .
    container_name: bot-ofertas-telegram
    restart: unless-stopped
    # Host network: o bot precisa alcançar a ponte do WhatsApp em 127.0.0.1:3001
    # (o bot só faz conexões de saída, não expõe portas)
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
